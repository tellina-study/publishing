{% extends "base.html" %}

{#- Фаза B: аналитика (Umami) + комментарии (Remark42), same-origin через Caddy. -#}

{% block extrahead %}
  {{ super() }}
  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-99D2ZE94Y7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-99D2ZE94Y7');
  </script>
  <!-- Umami: просмотры (self-host на этом же VM, отдаётся через /stats) -->
  <script defer src="/stats/script.js"
          data-website-id="35d3e86c-2507-45ec-ac7f-72ea825df3db"
          data-host-url="https://lessons.tellian.io/stats"></script>
  <!-- Глубина чтения: события scroll-25/50/75/100 в Umami -->
  <script>
    (function () {
      var fired = {}, marks = [25, 50, 75, 100];
      function onScroll() {
        if (!window.umami) return;
        var el = document.documentElement;
        var max = el.scrollHeight - el.clientHeight;
        var pct = max > 0 ? Math.round((el.scrollTop || document.body.scrollTop) / max * 100) : 100;
        marks.forEach(function (m) {
          if (pct >= m && !fired[m]) {
            fired[m] = true;
            umami.track('scroll-' + m, { path: location.pathname });
          }
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('load', onScroll);
    })();
  </script>
{% endblock %}

{% block content %}
  {{ super() }}
  {% if page and page.url and 'lectures/lec' in page.url %}
  <!-- Плавающие кнопки: наверх · комментарий · к списку лекций -->
  <nav class="fab-stack" aria-label="Быстрые действия">
    <a class="fab" href="{{ nav.homepage.url | url }}" title="К списку лекций" aria-label="К списку лекций">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
    </a>
    <a class="fab" href="#comments" title="Оставить комментарий" aria-label="Оставить комментарий">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1z"/></svg>
    </a>
    <button class="fab fab-top" type="button" title="Наверх" aria-label="Наверх"
            onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 6l7 7-1.4 1.4L13 9.8V20h-2V9.8l-4.6 4.6L5 13z"/></svg>
    </button>
  </nav>

  <!-- Remark42: комментарии/реакции (аноним + соц-логин), отдаётся через /comments -->
  <hr>
  <h2 id="comments">Комментарии</h2>
  <div id="remark42"></div>
  <script>
    var remark_config = {
      host: "https://lessons.tellian.io/comments",
      site_id: "course",
      components: ["embed"],
      locale: "ru",
      theme: (document.body.getAttribute('data-md-color-scheme') === 'slate') ? 'dark' : 'light'
    };
    (function () {
      var s = document.createElement('script');
      s.src = remark_config.host + '/web/embed.js';
      s.defer = true;
      (document.head || document.body).appendChild(s);
    })();
  </script>
  {% endif %}
{% endblock %}
